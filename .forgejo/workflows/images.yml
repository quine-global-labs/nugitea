# On every push to main that touches them: build nugitea's two images,
# push them to the forge's registry, and open petersweb-infra PRs that pin
# them (quine-global/site-image). Merging a PR deploys it to
# nugitea.in.quineglobal.com (petersweb-infra, nixos/arion-nugitea).
#
#   nugitea      elixir_nugitea, the server (HTTP, SSH, both tiers)
#   nugitea-web  rust_nugitea/web, the Nuxt frontend
#
# Runs on runner-arm64-linux (host mode, podman), arm64 like the forge VM
# nugitea runs on. The forge VM's own ubuntu-latest runner doesn't take this
# org's jobs.
#
# Secrets: REGISTRY_USERNAME and REGISTRY_PASSWORD (package write), or the
# org's REGISTRY_TOKEN (as quine-linux's iso.yml uses it); INFRA_TOKEN (push
# a branch to Cold-Air-Networks/petersweb-infra and open a PR there).
name: images

on:
  push:
    branches: [main]
    paths:
      - 'elixir_nugitea/**'
      - 'rust_nugitea/web/**'
      - '.forgejo/workflows/images.yml'
  workflow_dispatch:

jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nugitea
            context: elixir_nugitea
          - name: nugitea-web
            context: rust_nugitea/web
    runs-on: runner-arm64-linux
    steps:
      - uses: https://forge.in.quineglobal.com/quine-global-labs/mirror-actions-checkout@v4
      - uses: https://forge.in.quineglobal.com/quine-global/site-image@v1
        with:
          image: forge.in.quineglobal.com/quine-global-labs/${{ matrix.name }}
          context: ${{ matrix.context }}
          infra-file: nixos/arion-nugitea/arion-compose.nix
          name: ${{ matrix.name }}
          platform: linux/arm64
          registry-username: ${{ secrets.REGISTRY_USERNAME || vars.REGISTRY_USER || github.actor }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD || secrets.REGISTRY_TOKEN }}
          infra-token: ${{ secrets.INFRA_TOKEN }}

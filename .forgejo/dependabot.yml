# Dependabot on the forge (quine-global-labs/dependabot-core, forgejo/README.md):
# Dependabot's version 2 format; every daily run checks everything (no
# schedules, groups or ignore rules yet).
#
# The Elixir app, and the Nuxt frontend it serves (still under
# rust_nugitea/web); rust_nugitea's own crate is deprecated, so not checked.
version: 2
updates:
  - package-ecosystem: mix
    directory: /elixir_nugitea
  - package-ecosystem: npm
    directories:
      - /rust_nugitea/web
      - /e2e
  - package-ecosystem: docker
    directory: /rust_nugitea/web
  - package-ecosystem: gomod
    directory: /

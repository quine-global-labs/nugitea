# Dependabot on the forge (quine-global-labs/dependabot-core, forgejo/README.md):
# Dependabot's version 2 format; every daily run checks everything (no
# schedules, groups or ignore rules yet).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /rust_nugitea
  - package-ecosystem: docker
    directories:
      - /rust_nugitea
      - /rust_nugitea/web
  - package-ecosystem: docker-compose
    directory: /rust_nugitea
  - package-ecosystem: gomod
    directory: /
  - package-ecosystem: npm
    directory: /rust_nugitea/web
